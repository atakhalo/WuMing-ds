// 存档：localStorage 持久化

const SAVE_KEY = 'wumingjian_save_v1';
const META_KEY = 'wumingjian_meta_v1';

function loadRaw() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    return s ? JSON.parse(s) : null;
  } catch (e) {
    console.warn('存档读取失败', e);
    return null;
  }
}

function writeRaw(data) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.warn('存档写入失败', e);
    return false;
  }
}

function clearRaw() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) { /* ignore */ }
}

// 记录局外累计数据（死亡次数、最远层数等）

  } catch (e) {
    return { runs: 0, deaths: 0, bestFloor: 0 };
  }
}

function writeMeta(meta) {
  try {
    localStorage.setItem(META_KEY, JSON.stringify(meta));
  } catch (e) { /* ignore */ }

    this.renderForeground(ctx);

    // HUD
    this.renderHud(ctx);

    if (this.mode === 'panel') this.renderPanel(ctx);
    if (this.mode === 'char') this.renderCharPanel(ctx);
    if (this.askRestart) this.renderRestartAsk(ctx);
  }

  renderSky(ctx) {
    const H = this.game.H;
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 40);
    g.addColorStop(0, '#0e1018');
    g.addColorStop(0.42, '#1c1c26');
    g.addColorStop(0.74, '#33291f');
    g.addColorStop(1, '#241a13');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.game.W, H);

    // 星
    for (let i = 0; i < 60; i++) {
      const x = (i * 191.7) % this.game.W;
      const y = ((i * 97.3) % 240);
      const tw = 0.35 + Math.sin(this.animT * 1.4 + i) * 0.3;
      ctx.fillStyle = `rgba(230,225,210,${clamp(tw, 0, 1) * 0.55})`;
      ctx.fillRect(x, y, 1.4, 1.4);
    }

    // 月
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(240,236,220,0.92)';
    ctx.beginPath();
    ctx.arc(this.game.W - 132, 92, 30, 0, Math.PI * 2);
    ctx.fill();
    const mg = ctx.createRadialGradient(this.game.W - 132, 92, 20, this.game.W - 132, 92, 130);
    mg.addColorStop(0, 'rgba(220,215,190,0.18)');
    mg.addColorStop(1, 'rgba(220,215,190,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(this.game.W - 132, 92, 130, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  renderTown(ctx) {
    const camL = this.camX - 60;
    const camR = this.camX + this.game.W + 60;

    // 远山
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let layer = 0; layer < 2; layer++) {
      ctx.fillStyle = layer === 0 ? '#191a22' : '#20202a';
      ctx.beginPath();
      ctx.moveTo(camL, GROUND_Y);
      for (let x = camL; x <= camR; x += 30) {
        const h = Math.sin(x * 0.0042 + layer * 2.4) * 66 + Math.sin(x * 0.011 + layer) * 26;
        ctx.lineTo(x, 300 + layer * 26 - h * 0.5);
      }
      ctx.lineTo(camR, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 房屋
    const houses = [
      { x: 90, w: 190, h: 150, name: '铁铺' },
      { x: 330, w: 220, h: 176, name: '演武堂' },
      { x: 590, w: 200, h: 160, name: '医馆' },
      { x: 830, w: 230, h: 190, name: '悦来客栈' },
      { x: 1100, w: 180, h: 146, name: '杂货' },
    ];
    for (const h of houses) {
      const y = GROUND_Y - h.h;
      ctx.fillStyle = '#1d1a16';
      ctx.fillRect(h.x, y, h.w, h.h);
      ctx.fillStyle = '#262119';
      ctx.beginPath();
      ctx.moveTo(h.x - 18, y + 6);
      ctx.lineTo(h.x + h.w / 2, y - 34);
      ctx.lineTo(h.x + h.w + 18, y + 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,160,0.055)';
      ctx.fillRect(h.x + 16, y + 34, 34, 30);
      ctx.fillRect(h.x + h.w - 54, y + 34, 34, 30);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(h.x + 0.5, y + 0.5, h.w - 1, h.h - 1);

      // 招牌
      ctx.save();
      ctx.fillStyle = 'rgba(20,14,10,0.9)';
      ctx.fillRect(h.x + h.w / 2 - 26, y + 14, 52, 22);
      ctx.strokeStyle = 'rgba(212,162,76,0.5)';
      ctx.strokeRect(h.x + h.w / 2 - 26, y + 14, 52, 22);
      text(ctx, h.name, h.x + h.w / 2, y + 30, {
        size: 13, align: 'center', weight: 700, color: '#d8b878',
      });
      ctx.restore();
    }

    // 灯笼
    const lanterns = [180, 340, 560, 760, 960, 1180];
    for (const lx of lanterns) {
      const ly = 300 + Math.sin(this.animT * 1.6 + lx) * 3;
      const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, 62);
      g.addColorStop(0, 'rgba(255,170,90,0.30)');
      g.addColorStop(1, 'rgba(255,170,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(lx, ly, 62, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8f2e26';
      ctx.beginPath();
      ctx.ellipse(lx, ly, 10, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,120,0.65)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,200,120,0.2)';
      ctx.beginPath();
      ctx.moveTo(lx, ly - 13);
      ctx.lineTo(lx, ly - 40);
      ctx.stroke();
    }

    // 地面
    ctx.fillStyle = '#2e2a22';
    ctx.fillRect(camL, GROUND_Y, camR - camL, this.game.H - GROUND_Y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(camL, GROUND_Y, camR - camL, 3);
    for (let x = Math.floor(camL / 46) * 46; x < camR; x += 46) {
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 6);
      ctx.lineTo(x - 8, this.game.H);
      ctx.stroke();
    }
  }

  renderNpcs(ctx) {
    for (const n of this.npcs) {
      const isNear = this.nearNpc === n;

      if (n.role === 'trial') {
        this.renderDummy(ctx, n);
      } else {
        drawFigure(ctx, n.x, GROUND_Y, {
          scale: 0.98,
          facing: n.x > this.px ? -1 : 1,
          pose: 'idle',
          t: n.animT,
          bodyColor: n.tint,
          accentColor: shadeHex(n.tint, 0.6),
          sashColor: shadeHex(n.tint, 1.25),
          hideWeapon: true,
          bladeLength: 0,
        });
      }

      // 名字牌
      ctx.save();
      ctx.globalAlpha = isNear ? 1 : 0.72;
      const label = `${n.name} · ${n.title}`;
      ctx.font = `500 12px ${FONT}`;
      const tw = ctx.measureText(label).width;
      roundRectPath(ctx, n.x - tw / 2 - 8, GROUND_Y - 106, tw + 16, 20, 3);
      ctx.fillStyle = 'rgba(10,8,6,0.75)';
      ctx.fill();
      ctx.strokeStyle = isNear ? 'rgba(212,162,76,0.7)' : 'rgba(120,110,90,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      text(ctx, label, n.x, GROUND_Y - 92, {
        size: 12, align: 'center', color: isNear ? PAL.gold : PAL.paperDim,
      });

      if (isNear && this.mode === 'walk') {
        const bob = Math.sin(this.animT * 4) * 2;
        keyCap(ctx, n.x - 34, GROUND_Y - 128 + bob, 'E', {});
        text(ctx, '交谈', n.x - 12, GROUND_Y - 121 + bob, { size: 12, color: PAL.paper });
      }
    }
  }

  renderDummy(ctx, n) {
    const x = n.x;
    const y = GROUND_Y;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b5436';
    ctx.fillRect(x - 9, y - 78, 18, 78);
    ctx.fillStyle = '#7d6242';
    ctx.fillRect(x - 9, y - 78, 6, 78);
    // 横臂
    ctx.fillStyle = '#5f4a30';
    ctx.fillRect(x - 34, y - 60, 68, 9);
    ctx.fillRect(x - 26, y - 30, 52, 8);
    // 缠绕的草绳
    ctx.strokeStyle = 'rgba(150,120,80,0.55)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(x - 9, y - 70 + i * 15);
      ctx.lineTo(x + 9, y - 66 + i * 15);
      ctx.stroke();
    }
    // 刀痕
    ctx.strokeStyle = 'rgba(30,22,14,0.7)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 6; i++) {
      const yy = y - 74 + i * 12 + (i % 3) * 3;
      ctx.beginPath();
      ctx.moveTo(x - 8, yy);
      ctx.lineTo(x + 8, yy + 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  renderPlayer(ctx) {
    drawFigure(ctx, this.px, GROUND_Y, {
      scale: 1.0,
      facing: this.facing,
      pose: this.walk ? 'walk' : 'idle',
      t: this.animT,
      bodyColor: '#3d4a5c',
      accentColor: '#26303c',
      sashColor: PAL.crimson,
      bladeColor: this.game.player.weaponData.tint,
      bladeLength: 48,
    });
  }

  renderForeground(ctx) {
    const W = this.game.W, H = this.game.H;
    const g = ctx.createLinearGradient(0, H - 130, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H - 130, W, 130);
  }

  renderHud(ctx) {
    const W = this.game.W, H = this.game.H;
    const P = this.game.player;

    ctx.save();
    roundRectPath(ctx, 14, 12, 268, 74, 5);
    ctx.fillStyle = 'rgba(12,10,8,0.82)';
    ctx.fill();
    ctx.strokeStyle = PAL.line2;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    text(ctx, `无名 · Lv.${P.level}`, 26, 34, { size: 15, weight: 700, color: PAL.paper });
    text(ctx, `${P.gold} 两`, 268, 34, { size: 14, align: 'right', color: PAL.gold });

    const bw = 150;
    bar(ctx, 26, 42, bw, 9, P.hp / P.maxHp, PAL.hp, { r: 2 });
    bar(ctx, 26, 56, bw, 9, P.qi / P.maxQi, PAL.qi, { r: 2 });
    bar(ctx, 26, 70, bw, 7, P.exp / P.expToNext, PAL.jade, { r: 2 });

    text(ctx, `历练`, 26 + bw + 10, 50, { size: 10, color: PAL.paperFaint });
    text(ctx, `${Math.floor(P.exp)}/${P.expToNext}`, 268, 50, {
      size: 10, align: 'right', color: PAL.paperFaint,
    });
    if (P.attrPoints > 0) {
      const blink = 0.6 + Math.sin(this.animT * 5) * 0.4;
      ctx.save();
      ctx.globalAlpha = blink;
      text(ctx, `修为点 ×${P.attrPoints}（按 C 分配）`, 26, 96, {
        size: 12, weight: 700, color: '#ffd76a',
      });
      ctx.restore();
    }

    // 底部操作提示
    ctx.save();
    ctx.globalAlpha = 0.75;
    text(ctx, 'A / D 行走　·　E 交谈　·　C 内息　·　M 舆图　·　R 重开', W / 2, H - 18, {
      size: 12, align: 'center', color: PAL.paperDim,
    });
    ctx.restore();
  }

  renderRestartAsk(ctx) {
    const W = this.game.W, H = this.game.H;
    const P = this.game.player;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(0, 0, W, H);

    const pw = 420, ph = 176;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    roundRectPath(ctx, px, py, pw, ph, 8);
    ctx.fillStyle = 'rgba(18,14,11,0.98)';
    ctx.fill();
    ctx.strokeStyle = PAL.crimsonHi;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    strokeText(ctx, '重开一局', W / 2, py + 44, { size: 22, color: '#ffb26b', outline: 0 });

    text(ctx, '当前进度将全部抹去，回到初入江湖之时。', W / 2, py + 78, {
      size: 13, align: 'center', color: PAL.paper,
    });
    text(ctx, `等级 ${P.level}　银两 ${P.gold}　已学剑招 ${P.skills.length} 式`, W / 2, py + 102, {
      size: 12, align: 'center', color: PAL.paperFaint,
    });

    const blink = 0.6 + Math.sin(this.animT * 5) * 0.4;
    ctx.globalAlpha = blink;
    text(ctx, '空格 / 回车 确认重开　·　Esc 取消', W / 2, py + ph - 26, {
      size: 13, weight: 700, align: 'center', color: PAL.crimsonHi,
    });
    ctx.restore();
  }

  renderPanel(ctx) {
    const W = this.game.W, H = this.game.H;
    const p = this.panel;
    if (!p) return;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const pw = 640, ph = 404;
    const px = (W - pw) / 2, py = (H - ph) / 2;

    ctx.save();
    roundRectPath(ctx, px, py, pw, ph, 8);
    ctx.fillStyle = 'rgba(16,13,10,0.97)';
    ctx.fill();
    ctx.strokeStyle = PAL.line2;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    roundRectPath(ctx, px + 5, py + 5, pw - 10, ph - 10, 6);
    ctx.strokeStyle = 'rgba(212,162,76,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 头部
    text(ctx, p.npc.name, px + 26, py + 38, { size: 20, weight: 700, color: PAL.gold });
    text(ctx, p.npc.title, px + 26 + measure(ctx, p.npc.name, 20, 700) + 26, py + 38, {
      size: 12, color: PAL.paperFaint,
    });
    text(ctx, 'Esc 离开', px + pw - 26, py + 38, {
      size: 12, align: 'right', color: PAL.paperFaint,
    });
    ctx.save();
    ctx.strokeStyle = 'rgba(212,162,76,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + 26, py + 50);
    ctx.lineTo(px + pw - 26, py + 50);
    ctx.stroke();
    ctx.restore();

    // 台词
    text(ctx, p.line, px + 26, py + 74, { size: 13, color: '#9a8f76' });

    // 菜单
    const menuY = py + 100;
    drawMenu(ctx, px + 34, menuY, pw - 92, p.items, p.index, {
      maxRows: 6,
      selBg: 'rgba(212,162,76,0.11)',
    });

    // 底部
    const goldStr = `银两 ${this.game.player.gold}`;
    text(ctx, goldStr, px + 26, py + ph - 20, { size: 13, color: PAL.gold });
    text(ctx, '↑↓ 选择　Enter 确认', px + pw - 26, py + ph - 20, {
      size: 12, align: 'right', color: PAL.paperFaint,
    });
  }

  renderCharPanel(ctx) {
    const W = this.game.W, H = this.game.H;
    const P = this.game.player;
    const c = this.charPanel;
    if (!c) return;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const pw = 700, ph = 446;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    panelBox(ctx, px, py, pw, ph);

    text(ctx, '内息 · 行装', px + 26, py + 36, { size: 19, weight: 700, color: PAL.gold });
    text(ctx, `Lv.${P.level}　${P.exp}/${P.expToNext} 历练　剩余修为 ${P.attrPoints}`,
      px + 190, py + 36, { size: 13, color: PAL.paperDim });
    text(ctx, 'Esc/C 关闭', px + pw - 26, py + 36, {
      size: 12, align: 'right', color: PAL.paperFaint,
    });
    divider(ctx, px + 26, py + 48, pw - 52);

    // 左：属性
    sectionTitle(ctx, px + 26, py + 74, '根基');
    ATTRS.forEach((a, i) => {
      const sel = i === c.index;
      const y = py + 100 + i * 40;
      if (sel) {
        ctx.save();
        roundRectPath(ctx, px + 18, y - 16, 288, 34, 4);
        ctx.fillStyle = 'rgba(212,162,76,0.10)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(212,162,76,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
      text(ctx, a.name, px + 30, y, { size: 15, weight: sel ? 700 : 400, color: a.color });
      text(ctx, String(P.attrs[a.id]), px + 250, y, {
        size: 15, align: 'right', color: sel ? PAL.paper : PAL.paperDim,
      });
      text(ctx, a.desc, px + 30, y + 14, { size: 11, color: '#7d735e' });
    });

    // 左下方派生数值
    sectionTitle(ctx, px + 26, py + 274, '身手');
    const rows = [
      ['气血上限', Math.round(P.maxHp)],
      ['内力上限', Math.round(P.maxQi)],
      ['轻招伤害', P.lightDamage.toFixed(1)],
      ['重招伤害', P.heavyDamage.toFixed(1)],
      ['护体', Math.round(P.defense)],
      ['出招速度', `${(1 / P.speedMul * 100).toFixed(0)}%`],
    ];
    rows.forEach(([k, v], i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = px + 30 + col * 148;
      const y = py + 300 + row * 24;
      text(ctx, k, x, y, { size: 12, color: '#8b8069' });
      text(ctx, String(v), x + 130, y, { size: 12, align: 'right', color: PAL.paper });
    });
    // 剑意只在秘境里积攒，回镇必为 0——这里只说清规则，不显示数字
    text(ctx, '剑意于秘境中积攒，出秘境即散', px + 30, py + 372, { size: 11, color: '#6d6350' });

    // 右：装备与剑招
    sectionTitle(ctx, px + 364, py + 74, '行装');
    const w = P.weaponData;
    const ar = P.armorData;
    const equip = [
      ['兵器', `${w.name} +${P.weaponLevel}`],
      ['', `轻+${w.lightBonus + P.forge.light}　重+${w.heavyBonus + P.forge.heavy}　内力+${w.qiMax + P.forge.qi}`],
      ['护具', ar.name],
      ['', `气血+${ar.hpMax}　护体+${ar.def}`],
    ];
    equip.forEach(([k, v], i) => {
      const y = py + 100 + i * 22;
      if (k) {
        text(ctx, k, px + 372, y, { size: 13, color: PAL.paperDim });
        text(ctx, v, px + 632, y, { size: 13, align: 'right', color: PAL.paper });
      } else {
        text(ctx, v, px + 372, y, { size: 11, color: '#7d735e' });
      }
    });

    sectionTitle(ctx, px + 364, py + 202, `剑招 (${P.skills.length}/${SKILLS.length})`);
    P.skills.forEach((sid, i) => {
      const s = SKILLS.find((x) => x.id === sid);
      if (!s) return;
      const y = py + 226 + i * 26;
      const pat = s.pattern.map((m) => (m === 'light' ? '轻' : '重')).join('·');
      text(ctx, pat, px + 372, y, { size: 12.5, color: baseTint(s.tint), weight: 700 });
      text(ctx, s.name, px + 424, y, { size: 13.5, color: PAL.paper });
      text(ctx, `耗气 ${s.qi}`, px + 632, y, { size: 11, align: 'right', color: PAL.paperFaint });
      text(ctx, `${s.steps.length} 段 · 总伤 ${Math.round(skillTotalDamage(s))}`,
        px + 372, y + 11, { size: 10.5, color: '#8a8070' });
      if (s.as) {
        text(ctx, `接续 ${s.as === 'light' ? '轻' : '重'}`, px + 632, y + 11,
          { size: 10.5, align: 'right', color: baseTint(s.tint) });
      }
    });

    text(ctx, '绝学：无明剑意　按 U　需剑意攒满（出招累积，跨战斗保留）',
      px + 372, py + ph - 24, { size: 11, color: '#8a6a2f' });
    text(ctx, '战斗为时间轴制：轮到你时冻结选行动，表演不入轴，只有 cd 段推进时间',
      px + 372, py + ph - 10, { size: 10.5, color: '#6d6350' });
  }
}

function baseTint(hex) {
  return hex || PAL.paper;
}

function panelBox(ctx, x, y, w, h) {
  ctx.save();
  roundRectPath(ctx, x, y, w, h, 8);
  ctx.fillStyle = 'rgba(16,13,10,0.97)';
  ctx.fill();
  ctx.strokeStyle = PAL.line2;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  roundRectPath(ctx, x + 5, y + 5, w - 10, h - 10, 6);
  ctx.strokeStyle = 'rgba(212,162,76,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function divider(ctx, x, y, w) {
  ctx.save();
  ctx.strokeStyle = 'rgba(212,162,76,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.stroke();
  ctx.restore();
}

function shadeHex(hex, k) {
  if (!hex || hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if (h.length === 3) h = h.split('').map((ch) => ch + ch).join('');
  const n = parseInt(h, 16);
  const r = clamp(Math.round(((n >> 16) & 255) * k), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * k), 0, 255);
  const b = clamp(Math.round((n & 255) * k), 0, 255);
  return `rgb(${r},${g},${b})`;
}

      const b = this.rooms[i];
      if (Math.random() < 0.5) {
        this.hCorridor(a.cx, b.cx, a.cy);
        this.vCorridor(a.cy, b.cy, b.cx);
      } else {
        this.vCorridor(a.cy, b.cy, a.cx);
        this.hCorridor(a.cx, b.cx, b.cy);
      }
    }
    // 额外回环，避免死路太多
    const extra = randInt(1, 3);
    for (let i = 0; i < extra; i++) {
      const a = this.rooms[randInt(0, this.rooms.length - 1)];
      const b = this.rooms[randInt(0, this.rooms.length - 1)];
      if (a === b) continue;
      this.hCorridor(a.cx, b.cx, a.cy);
      this.vCorridor(a.cy, b.cy, b.cx);
    }
  }

  freeTileIn(room, minDistFromSpawn) {
    for (let t = 0; t < 30; t++) {
      const x = randInt(room.x + 1, room.x + room.w - 2);
      const y = randInt(room.y + 1, room.y + room.h - 2);
      if (this.isWall(x, y)) continue;
      if (occupied(x, y, this.enemies) || occupied(x, y, this.pickups)) continue;
      return { x, y };
    }
    return null;
  }

  placeStuff() {
    const rooms = this.rooms;
    const spawnRoom = rooms[0];

    // 出口：离出生房间最远
    let far = rooms[1] || rooms[0];
    let bestD = -1;
    for (let i = 1; i < rooms.length; i++) {
      const d = Math.abs(rooms[i].cx - spawnRoom.cx) + Math.abs(rooms[i].cy - spawnRoom.cy);
      if (d > bestD) { bestD = d; far = rooms[i]; }
    }
    this.exit = { x: far.cx, y: far.cy };

    // 敌人（避开出生房间，且与出生点保持距离，别一进图就贴脸）
    const baseCount = 4 + Math.floor(this.tier * 1.4) + Math.floor(this.floor * 0.8);
    const count = Math.min(16, baseCount + randInt(-1, 2));
    for (let i = 0; i < count; i++) {
      const room = rooms[randInt(1, rooms.length - 1)];
      if (!room) continue;
      const pos = this.freeTileIn(room);
      if (!pos) continue;
      if (Math.hypot(pos.x - spawnRoom.cx, pos.y - spawnRoom.cy) < 6.5) continue;
      if (Math.abs(pos.x - this.exit.x) < 2 && Math.abs(pos.y - this.exit.y) < 2) continue;
      const def = rollEnemyForTier(this.tier, false);
      this.enemies.push(this.makeEnemy(def, pos.x, pos.y, room));
    }

    // Boss 层：出口旁放 Boss
    if (this.isBossFloor) {
      const bd = bossForTier(this.tier);
      const bx = clamp(this.exit.x + randInt(-3, 3), 2, MW - 3);
      const by = clamp(this.exit.y + randInt(-3, 3), 2, MH - 3);
      const spot = this.findNear(bx, by);
      if (spot) {
        const boss = this.makeEnemy(bd, spot.x, spot.y, far);
        boss.isBoss = true;
        this.enemies.push(boss);
        this.pendingBoss = boss;
      }
    }

    // 宝箱 / 草药
    const chests = randInt(2, 3);
    for (let i = 0; i < chests; i++) {
      const room = rooms[randInt(1, rooms.length - 1)];
      const pos = room && this.freeTileIn(room);
      if (pos) this.pickups.push({ x: pos.x, y: pos.y, kind: 'chest', taken: false, room });
    }
    const herbs = randInt(2, 4);
    for (let i = 0; i < herbs; i++) {
      const room = rooms[randInt(0, rooms.length - 1)];
      const pos = room && this.freeTileIn(room);
      if (pos) this.pickups.push({ x: pos.x, y: pos.y, kind: 'herb', taken: false, room });
    }
  }

  findNear(x, y) {
    for (let r = 0; r < 6; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const nx = x + dx, ny = y + dy;
          if (this.isWall(nx, ny)) continue;
          return { x: nx, y: ny };
        }
      }
    }
    return null;
  }

  makeEnemy(def, x, y, room) {
    return {
      def,
      tx: x, ty: y,
      px: (x + 0.5) * TS,
      py: (y + 0.5) * TS,
      home: room ? { x: room.cx, y: room.cy } : { x, y },
      moving: null,
      stepT: 0,
      think: rand(0.2, 1.2),
      facing: 1,
      animT: Math.random() * 3,
      mode: 'patrol',
      awake: false,
      dead: false,
    };
  }

  // ---------------- 更新 ----------------
  update(dt) {
    // 人物面板打开时整张地图冻结（包括巡逻的敌人），看信息不吃亏
    if (this.showChar) {
      if (justPressed('KeyC') || justPressed('KeyI') || justPressed('Escape')) {
        this.showChar = false;
        sfx.ui();
      }
      return;
    }

    this.animT += dt;
    if (this.flash) {
      this.flash.t += dt;
      if (this.flash.t > 2.0) this.flash = null;
    }
    if (this.battleCooldown > 0) this.battleCooldown -= dt;
    if (this.game.player.hp <= 0) this.game.player.hp = 1;

    this.updatePlayer(dt);
    this.updateEnemies(dt);
    this.updateCam(dt);
    this.checkPickups();

    // 随时可查人物信息（C / I）
    if (justPressed('KeyC') || justPressed('KeyI')) {
      this.showChar = true;
      sfx.ui();
      return;
    }

    if (justPressed('Escape')) {
      this.game.toast('离开副本，进度不保。', PAL.crimsonHi);
      this.game.run = null;
      this.game.goto('world');
    }

    // Boss 警示
    if (this.pendingBoss && !this.bossWarned) {
      const b = this.pendingBoss;
      if (Math.hypot(b.px - this.px, b.py - this.py) < 5 * TS) {
        this.bossWarned = true;
        this.flash = { text: `强敌气息：${b.def.name}`, t: 0, color: PAL.crimsonHi };
        sfx.fail();
      }
    }
  }

  updatePlayer(dt) {
    const P = this.game.player;
    if (this.moving) {
      this.stepT += dt / STEP_DUR;
      if (this.stepT >= 1) {
        this.tx = this.moving.tx;
        this.ty = this.moving.ty;
        this.px = (this.tx + 0.5) * TS;
        this.py = (this.ty + 0.5) * TS;
        this.moving = null;
        this.stepT = 0;
        this.reveal();
        this.onArrive();
      } else {
        const k = easeOutQuad(this.stepT);
        this.px = lerp(this.moving.sx, (this.moving.tx + 0.5) * TS, k);
        this.py = lerp(this.moving.sy, (this.moving.ty + 0.5) * TS, k);
      }
      return;
    }

    if (this.battleCooldown > 0) return;

    let dx = 0, dy = 0;
    if (isAnyDown(['KeyA', 'ArrowLeft'])) dx = -1;
    else if (isAnyDown(['KeyD', 'ArrowRight'])) dx = 1;
    else if (isAnyDown(['KeyW', 'ArrowUp'])) dy = -1;
    else if (isAnyDown(['KeyS', 'ArrowDown'])) dy = 1;
    if (!dx && !dy) return;

    if (dx !== 0) this.facing = dx;
    const nx = this.tx + dx;
    const ny = this.ty + dy;
    if (this.isWall(nx, ny)) {
      sfx.step();
      return;
    }
    this.moving = { tx: nx, ty: ny, sx: this.px, sy: this.py };
    this.stepT = 0;
    sfx.step();
  }

  updateEnemies(dt) {
    const P = this.game.player;
    for (const e of this.enemies) {
      if (e.dead) continue;
      e.animT += dt;

      if (e.moving) {
        e.stepT += dt / (STEP_DUR * 1.55);
        if (e.stepT >= 1) {
          e.tx = e.moving.tx;
          e.ty = e.moving.ty;
          e.px = (e.tx + 0.5) * TS;
          e.py = (e.ty + 0.5) * TS;
          e.moving = null;
          e.stepT = 0;
        } else {
          const k = easeOutQuad(e.stepT);
          e.px = lerp(e.moving.sx, (e.moving.tx + 0.5) * TS, k);
          e.py = lerp(e.moving.sy, (e.moving.ty + 0.5) * TS, k);
        }
        continue;
      }

      const d = Math.hypot(e.px - this.px, e.py - this.py);
      const detect = e.def.boss ? 7.5 * TS : 5.2 * TS;

      if (d < detect) { e.awake = true; e.mode = 'chase'; }
      else if (e.awake && d > detect * 1.9) { e.awake = false; e.mode = 'patrol'; }

      // 接战
      if (d < TS * 0.86 && this.battleCooldown <= 0) {
        this.startBattle(e);
        return;
      }

      e.think -= dt;
      if (e.think > 0) continue;
      e.think = e.mode === 'chase' ? rand(0.16, 0.3) : rand(0.5, 1.3);

      let dir = null;
      if (e.mode === 'chase') {
        const dx = this.tx - e.tx;
        const dy = this.ty - e.ty;
        const opts = [];
        if (Math.abs(dx) > 0) opts.push({ x: Math.sign(dx), y: 0, w: 3 });
        if (Math.abs(dy) > 0) opts.push({ x: 0, y: Math.sign(dy), w: 3 });
        opts.push({ x: randInt(-1, 1), y: 0, w: 1 });
        opts.push({ x: 0, y: randInt(-1, 1), w: 1 });
        const valid = opts.filter((o) => (o.x || o.y) && !this.isWall(e.tx + o.x, e.ty + o.y));
        if (valid.length) {
          let total = valid.reduce((a, o) => a + o.w, 0);
          let r = Math.random() * total;
          for (const o of valid) { r -= o.w; if (r <= 0) { dir = o; break; } }
          if (!dir) dir = valid[0];
        }
      } else {
        // 巡逻：在出生房间附近游走
        const distHome = Math.abs(e.tx - e.home.x) + Math.abs(e.ty - e.home.y);
        const tries = [
          { x: randInt(-1, 1), y: 0 },
          { x: 0, y: randInt(-1, 1) },
        ];
        for (const o of tries) {
          if (!(o.x || o.y)) continue;
          if (this.isWall(e.tx + o.x, e.ty + o.y)) continue;
          if (distHome > 4) {
            const backX = Math.sign(e.home.x - e.tx);
            const backY = Math.sign(e.home.y - e.ty);
            if (Math.abs(e.home.x - e.tx) > Math.abs(e.home.y - e.ty)) { o.x = backX; o.y = 0; }
            else { o.x = 0; o.y = backY; }
            if (this.isWall(e.tx + o.x, e.ty + o.y)) continue;
          }
          dir = o;
          break;
        }
      }

      if (dir && (dir.x || dir.y)) {
        e.moving = { tx: e.tx + dir.x, ty: e.ty + dir.y, sx: e.px, sy: e.py };
        e.stepT = 0;
        if (dir.x !== 0) e.facing = dir.x;
      }
    }
  }

  updateCam(dt) {
    const W = this.game.W, H = this.game.H;
    const txx = clamp(this.px - W / 2, 0, MW * TS - W);
    const tyy = clamp(this.py - H / 2, 0, MH * TS - H);
    this.cam.x = lerp(this.cam.x, txx, clamp(dt * 7, 0, 1));
    this.cam.y = lerp(this.cam.y, tyy, clamp(dt * 7, 0, 1));
  }

  snapCam() {
    const W = this.game.W, H = this.game.H;
    this.cam.x = clamp(this.px - W / 2, 0, MW * TS - W);
    this.cam.y = clamp(this.py - H / 2, 0, MH * TS - H);
  }

  reveal() {
    const R = Math.ceil(SIGHT_R);
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        if (dx * dx + dy * dy > SIGHT_R * SIGHT_R) continue;
        const x = this.tx + dx, y = this.ty + dy;
        if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
        this.explored[this.idx(x, y)] = 1;
      }
    }
  }

  onArrive() {
    // 出口
    if (this.exit && this.tx === this.exit.x && this.ty === this.exit.y) {
      if (this.isBossFloor && this.pendingBoss && !this.pendingBoss.dead) {
        this.flash = { text: '先解决眼前的对手', t: 0, color: PAL.crimsonHi };
        return;
      }
      this.useExit();
      return;
    }
    // 拾取
    for (const p of this.pickups) {
      if (!p.taken && p.x === this.tx && p.y === this.ty) this.takePickup(p);
    }
  }

  checkPickups() {
    for (const p of this.pickups) {
      if (!p.taken && p.x === this.tx && p.y === this.ty) this.takePickup(p);
    }
  }

  takePickup(p) {
    p.taken = true;
    const P = this.game.player;
    if (p.kind === 'chest') {
      if (Math.random() < 0.45) {
        const id = rollDrop(this.tier);
        P.addItem(id, 1);
        const it = getItem(id);
        this.flash = { text: `箱中：${it ? it.name : id}`, t: 0, color: PAL.jadeHi };
        this.game.toast(`拾得 ${it ? it.name : id}`, PAL.jadeHi);
      } else {
        const g = randInt(20, 40) + this.tier * 18;
        P.gold += g;
        this.flash = { text: `箱中：银两 +${g}`, t: 0, color: PAL.gold };
        this.game.toast(`拾得银两 +${g}`, PAL.gold);
      }
    } else {
      const heal = Math.round(P.maxHp * 0.18) + 8;
      P.hp = Math.min(P.maxHp, P.hp + heal);
      this.flash = { text: `草药：气血 +${heal}`, t: 0, color: '#7ce08a' };
      this.game.toast(`服下草药，气血 +${heal}`, '#7ce08a');
    }
    sfx.pickup();
    this.game.save();
  }

  // ---------------- 战斗 ----------------
  startBattle(enemy) {
    this.battleCooldown = 2.2;
    this.currentEnemy = enemy;
    const isBossFight = !!enemy.isBoss;
    this.game.goto('battle', {
      enemyId: enemy.def.id,
      tier: enemy.isBoss ? enemy.def.tier : this.tier,
      theme: this.theme,
      onEnd: this._onBattleEnd,
    });
  }

  _onBattleEnd(res) {
    const e = this.currentEnemy;
    const P = this.game.player;
    const back = () => {
      this.battleCooldown = 1.6;
      this.game.goto('dungeon', { resume: true });
    };

    if (res.result === 'victory' && e) {
      e.dead = true;
      P.kills++;
      if (e.isBoss) {
        this.pendingBoss = null;
        this.game.toast(`${e.def.name} 已伏诛`, '#ffd76a');
      }
      back();
    } else if (res.result === 'defeat') {
      this.game.run = null;
      this.game.player.deaths++;
      const lost = Math.floor(P.gold * 0.25);
      P.gold = Math.max(0, P.gold - lost);
      P.hp = Math.max(1, Math.round(P.maxHp * 0.4));
      this.game.save();
      this.game.toast(lost > 0 ? `败北，失落银两 ${lost}` : '败北', PAL.crimsonHi);
      this.game.goto('base');
    } else {
      // 逃跑：被推离一格
      const dx = Math.sign(this.px - e.px) || 1;
      const nx = clamp(this.tx - dx, 1, MW - 2);
      if (!this.isWall(nx, this.ty)) {
        this.tx = nx;
        this.px = (nx + 0.5) * TS;
      }
      this.game.toast('你脱离了战斗', PAL.paperDim);
      back();
    }
  }

  useExit() {
    const P = this.game.player;
    if (this.floor >= this.totalFloors) {
      this.finishDungeon();
      return;
    }
    P.hp = Math.min(P.maxHp, P.hp + Math.round(P.maxHp * 0.22));
    const r = this.game.run;
    if (r) r.floor = this.floor + 1;
    this.game.toast(`踏入更深一层（气血稍复）`, PAL.jadeHi);
    sfx.pickup();
    this.game.goto('dungeon', {
      locId: this.locId,
      floor: this.floor + 1,
    });
  }

  finishDungeon() {
    const P = this.game.player;
    const loc = this.loc;
    const gold = 90 + loc.tier * 130 + randInt(0, 60);
    const exp = 60 + loc.tier * 90;
    P.gold += gold;
    const ups = P.addExp(exp);
    P.bestFloor = Math.max(P.bestFloor, loc.tier);

    // 任务完成
    const quest = QUESTS.find((q) => q.goal.loc === this.locId && !P.doneQuests.includes(q.id));
    let questMsg = null;
    if (quest) {
      P.doneQuests.push(quest.id);
      const ai = P.activeQuests.indexOf(quest.id);
      if (ai >= 0) P.activeQuests.splice(ai, 1);
      P.gold += quest.reward.gold;
      P.addExp(quest.reward.exp);
      for (const it of quest.reward.items) P.addItem(it.id, it.n);
      if (quest.unlocks && !P.unlocked.includes(quest.unlocks)) {
        P.unlocked.push(quest.unlocks);
        const nl = getLocation(quest.unlocks);
        questMsg = `新地点开启：${nl.name}`;
      }
      const next = QUESTS.find((q) => q.requires === quest.id);
      if (next && !P.activeQuests.includes(next.id) && !P.doneQuests.includes(next.id)) {
        P.activeQuests.push(next.id);
        if (!questMsg) questMsg = `新委托：${next.title}`;
      }
    }

    this.game.run = null;
    this.game.save();
    if (ups > 0) {
      sfx.levelUp();
      this.game.toast(`修为精进！等级 ${P.level}`, '#ffd76a');
    }
    this.game.goto('result', {
      title: '副本通关',
      subtitle: loc.name,
      lines: [
        `历练 +${exp}`,
        `银两 +${gold}`,
        quest ? `任务完成：${quest.title}` : null,
        questMsg,
      ].filter(Boolean),
    });
  }

  // ---------------- 渲染 ----------------
  render(ctx) {
    const W = this.game.W, H = this.game.H;
    const t = this.theme;

    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-Math.round(this.cam.x), -Math.round(this.cam.y));
    this.renderMap(ctx);
    this.renderPickups(ctx);
    this.renderEnemies(ctx);
    this.renderPlayer(ctx);
    ctx.restore();

    // 边缘暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.36, W / 2, H / 2, H * 0.86);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    this.renderUI(ctx);
    if (this.showChar) {
      const P = this.game.player;
      renderCharPanel(ctx, W, H, P, {
        hp: P.hp, maxHp: P.maxHp,
        qi: P.qi, maxQi: P.maxQi,
        intent: P.intent, maxIntent: P.maxIntent,
        showStam: false,      // 体力是战斗内资源，走图时没有意义
        tip: '剑意随本次秘境探索而生灭，出秘境即散',
      });
    }
  }

  renderMap(ctx) {
    const W = this.game.W, H = this.game.H;
    const t = this.theme;
    const x0 = Math.max(0, Math.floor(this.cam.x / TS) - 1);
    const x1 = Math.min(MW - 1, Math.ceil((this.cam.x + W) / TS) + 1);
    const y0 = Math.max(0, Math.floor(this.cam.y / TS) - 1);
    const y1 = Math.min(MH - 1, Math.ceil((this.cam.y + H) / TS) + 1);

    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = this.idx(x, y);
        const px = x * TS, py = y * TS;
        const seen = this.explored[i];

        if (!seen) {
          ctx.fillStyle = '#070605';
          ctx.fillRect(px, py, TS, TS);
          continue;
        }

        const dgr = Math.hypot(x + 0.5 - (this.px / TS), y + 0.5 - (this.py / TS));
        const inSight = dgr < SIGHT_R;
        // 视野内最亮，边缘柔和过渡；已探索但离开视野则压暗
        const edge = inSight ? clamp((SIGHT_R - dgr) / 2.4, 0, 1) : 0;
        const dim = inSight ? lerp(0.52, 1, edge) : 0.4;

        if (this.map[i] === 0) {
          ctx.fillStyle = shade(t.wall || '#2c2b26', dim * 0.78);
          ctx.fillRect(px, py, TS, TS);
          const topOpen = y > 0 && this.map[this.idx(x, y - 1)] === 1;
          if (topOpen) {
            ctx.fillStyle = shade(t.accent || '#6f8f5c', dim * 0.42);
            ctx.fillRect(px, py, TS, 3);
          }
          ctx.fillStyle = `rgba(0,0,0,${0.28 * dim})`;
          ctx.fillRect(px, py + TS - 5, TS, 5);
        } else {
          const n = hash2(x, y, 7);
          ctx.fillStyle = shade(t.floor || '#3a3630', dim);
          ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = `rgba(255,255,255,${0.028 * dim})`;
          ctx.fillRect(px + n * 24, py + hash2(x, y, 3) * 24, 3, 2);
          if (hash2(x, y, 11) > 0.9) {
            ctx.fillStyle = shade(t.accent || '#6f8f5c', dim * 0.34);
            ctx.fillRect(px + 10 + n * 12, py + 14 + n * 10, 5, 2);
          }
          ctx.strokeStyle = `rgba(0,0,0,${0.20 * dim})`;
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, TS - 1, TS - 1);
        }

        if (!inSight) {
          ctx.fillStyle = `rgba(6,5,4,${0.42 + (1 - dim) * 0.3})`;
          ctx.fillRect(px, py, TS, TS);
        }
      }
    }

    // 出口
    if (this.exit && this.explored[this.idx(this.exit.x, this.exit.y)]) {
      const ex = (this.exit.x + 0.5) * TS;
      const ey = (this.exit.y + 0.5) * TS;
      const pulse = 0.55 + Math.sin(this.game.time * 3) * 0.45;
      ctx.save();
      ctx.globalAlpha = 0.55 + pulse * 0.35;
      const g = ctx.createRadialGradient(ex, ey, 2, ex, ey, 30);
